name: ShareFiles
options:
  bundleIdPrefix: com.sharefiles
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
targets:
  ShareFiles:
    type: application
    platform: iOS
    sources:
      - path: ShareFiles
      - path: Core/Sources/ShareFilesCore
        group: Core
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sharefiles.app
        PRODUCT_NAME: ShareFiles
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_BITCODE: NO
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
    info:
      path: ShareFiles/Info.plist
      properties:
        CFBundleDisplayName: Share Files
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: ""
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIUserInterfaceStyle: Dark
        # Received files show up in the Files app under "On My iPhone".
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        # The PC is reached by IP address with a pinned self-signed certificate.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: Share Files tìm và kết nối với PC của bạn trong mạng nhà.
        NSBonjourServices:
          - _sharefiles._tcp
        NSCameraUsageDescription: Camera dùng để quét mã QR ghép đôi với PC.
        NSPhotoLibraryAddUsageDescription: Lưu ảnh và video nhận từ PC vào thư viện Ảnh.
        CFBundleURLTypes:
          - CFBundleURLName: com.sharefiles.pair
            CFBundleURLSchemes:
              - sharefiles
